<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Registration | Hyipro</title>
</head>
<body>
    <h1>Hyipro Student Registration</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>

    <p>
        Already registered?
        <a href="{% url 'login' %}">Login here</a>
    </p>
</body>
</html>
