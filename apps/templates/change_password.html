<!DOCTYPE html>
<html>
<head>
    <title>Change Password | Hyipro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f5fa;
            margin: 0;
            padding: 30px;
            color: #263247;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        h1 {
            color: #263b70;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd2df;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
        }

        .helptext {
            display: block;
            color: #758096;
            font-size: 12px;
            margin-top: 7px;
        }

        .errorlist {
            color: #c62828;
        }

        button, .btn {
            padding: 11px 20px;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 14px;
        }

        button {
            background: #263b70;
            color: white;
        }

        .btn {
            background: #e8ebf2;
            color: #263247;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>Change Password</h1>

        <p>Enter your current password and choose a new password.</p>

        <form method="POST">
            {% csrf_token %}

            {% for field in form %}
                <div class="field">

                    <label for="{{ field.id_for_label }}">
                        {{ field.label }}
                    </label>

                    {{ field }}

                    {% if field.help_text %}
                        <div class="helptext">
                            {{ field.help_text|safe }}
                        </div>
                    {% endif %}

                    {% if field.errors %}
                        <div class="errorlist">
                            {{ field.errors }}
                        </div>
                    {% endif %}

                </div>
            {% endfor %}

            <div class="buttons">

                <button type="submit">
                    Update Password
                </button>

                <a href="{% url 'account_security' %}"
                   class="btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
