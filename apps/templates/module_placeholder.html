<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Hyipro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 0;
        }

        header {
            background: #17365d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #17365d;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #17365d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: #24558b;
        }
    </style>
</head>

<body>
    <header>
        <h1>Hyipro Management System</h1>
    </header>

    <div class="container">
        <h2>{{ title }}</h2>

        <p>{{ description }}</p>

        <p>
            This module page is ready.
            More management features can be added here.
        </p>

        <a href="{% url 'home' %}">Back to Dashboard</a>
    </div>
</body>
</html>
