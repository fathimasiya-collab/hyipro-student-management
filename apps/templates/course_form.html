<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | Hyipro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        header {
            background: #17365d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 650px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, textarea {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button, .button {
            display: inline-block;
            margin-top: 20px;
            padding: 11px 18px;
            background: #17365d;
            color: white;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            cursor: pointer;
        }

        .errorlist {
            color: #b42318;
        }

        .helptext {
            color: #555;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <header>
        <h1>Hyipro Management System</h1>
    </header>

    <div class="container">
        <h2>{{ title }}</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <label for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>

                {{ field }}

                {% if field.help_text %}
                    <small class="helptext">{{ field.help_text }}</small>
                {% endif %}

                {{ field.errors }}
            {% endfor %}

            <button type="submit">Save Course</button>

            <a href="{% url 'courses_module' %}" class="button">
                Cancel
            </a>
        </form>
    </div>
</body>
</html>
