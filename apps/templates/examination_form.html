<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>
    <style>
        body { font-family: Arial; background: #f4f6f9; padding: 30px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 25px; border-radius: 10px; }
        input, select, textarea { width: 100%; padding: 10px; margin: 8px 0 16px; box-sizing: border-box; }
        button, a { padding: 10px 15px; border: none; border-radius: 5px; text-decoration: none; cursor: pointer; }
        button { background: #2563eb; color: white; }
        a { background: #555; color: white; }
        .errorlist { color: red; }
    </style>
</head>
<body>
<div class="container">

    <h2>{{ title }}</h2>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Save Examination</button>
        <a href="{% url 'examination_module' %}">Cancel</a>
    </form>

</div>
</body>
</html>
