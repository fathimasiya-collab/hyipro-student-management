<!DOCTYPE html>
<html>
<head>
    <title>Delete Student Result</title>
</head>
<body style="font-family: Arial; background: #f4f6f9; padding: 30px;">

<div style="max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 10px;">

    <h2>Delete Student Result</h2>

    <p>Are you sure you want to delete this result?</p>

    <p><strong>Student:</strong> {{ result.student.full_name }}</p>
    <p><strong>Examination:</strong> {{ result.examination.exam_name }}</p>
    <p><strong>Secured Marks:</strong> {{ result.secured_marks }}</p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit" style="background: #dc2626; color: white; padding: 10px 15px; border: none;">
            Yes, Delete
        </button>

        <a href="{% url 'exam_results' result.examination.pk %}">Cancel</a>
    </form>

</div>
</body>
</html>
